[package]
name = "idis"
version = "0.3.8"
edition = "2021"
description = "Cross-platform Web Extended Screen, macOS virtual display & window routing host (with optional legacy display client compatibility)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MrLYC/idis"
homepage = "https://github.com/MrLYC/idis"
keywords = ["extended-display", "virtual-display", "screen-sharing", "h264", "webrtc"]
categories = ["multimedia::video", "network-programming"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
getrandom = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sentry = { version = "0.49", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "panic",
    "rustls",
    "tracing",
    "ureq",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
