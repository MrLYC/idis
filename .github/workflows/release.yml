name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: idis-macos-arm64
            bin: idis
            archive: tar.gz
            run_tests: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: idis-macos-x86_64
            bin: idis
            archive: tar.gz
            run_tests: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: idis-linux-x86_64
            bin: idis
            archive: tar.gz
            run_tests: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: idis-linux-arm64
            bin: idis
            archive: tar.gz
            run_tests: false
            cross_linux_arm64: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: idis-windows-x86_64
            bin: idis.exe
            archive: zip
            run_tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 cross-linker
        if: ${{ matrix.cross_linux_arm64 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run tests (native targets)
        if: ${{ matrix.run_tests }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact (tar.gz)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}/docs
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.artifact }}/
          cp LICENSE THIRD_PARTY_LICENSES.txt README.md README.en.md dist/${{ matrix.artifact }}/
          cp -r docs/hosting dist/${{ matrix.artifact }}/docs/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package artifact (zip)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact }}/docs" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}/"
          Copy-Item "LICENSE","THIRD_PARTY_LICENSES.txt","README.md","README.en.md" "dist/${{ matrix.artifact }}/"
          Copy-Item -Recurse "docs/hosting" "dist/${{ matrix.artifact }}/docs/"
          Compress-Archive -Path "dist/${{ matrix.artifact }}" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
